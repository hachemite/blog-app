<!DOCTYPE html>
<html lang="en" data-bs-theme="light"> <!-- Default theme is light -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Django Blog</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <style>
    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }
    .theme-toggle-btn:hover {
      transform: rotate(360deg);
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom">
      <div class="nav-left">
        <h1><a href="{% url 'home' %}" class="text-decoration-none fw-bold display-4"><i class="bi bi-journal-text me-2"></i>Django Blog</a></h1>
      </div>      <div class="nav-right d-flex align-items-center">
        <button id="theme-toggle" class="btn btn-outline-secondary me-3 theme-toggle-btn d-flex align-items-center justify-content-center">
          <i class="bi bi-sun-fill" id="theme-icon"></i>
        </button>
        <a href="{% url 'post_new' %}" class="btn btn-primary d-flex align-items-center">
          <i class="bi bi-plus-lg me-2"></i>
          <span class="d-none d-sm-inline">New Post</span>
        </a>
      </div>    </header>

    <!-- Auth Status -->
    <div class="auth-status mb-4">
      {% if user.is_authenticated %}
        <p class="h5 mb-3">Welcome back, <strong class="text-primary">{{ user.username }}</strong>! 🎉</p>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-lg"><i class="bi bi-box-arrow-right me-2"></i>Log out</a>
      {% else %}
        <p>You are not logged in.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Log In</a>
        <a href="{% url 'signup' %}" class="btn btn-outline-success">Sign Up</a>
      {% endif %}
    </div>

    <!-- Main Content -->
    <main>
      {% block content %}
      {% endblock content %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Function to toggle dark mode
    function toggleDarkMode() {
      const htmlElement = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');
      const currentTheme = htmlElement.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      htmlElement.setAttribute('data-bs-theme', newTheme);
      
      // Toggle icon
      if (newTheme === 'dark') {
        themeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
      } else {
        themeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
      }

      // Save the preference in local storage
      localStorage.setItem('theme', newTheme);
    }

    // Check local storage for theme preference on page load
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      const themeIcon = document.getElementById('theme-icon');
      
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
      
      // Set initial icon
      if (savedTheme === 'dark') {
        themeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
      }
    });

    // Add event listener to the theme toggle button
    document.getElementById('theme-toggle').addEventListener('click', toggleDarkMode);
  </script>
</body>

</html>
