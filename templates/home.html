{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        {% for post in post_list %}
        <div class="col-md-8 offset-md-2 mb-4">
            <div class="card position-relative"> <!-- Add position-relative here -->
                <div class="splash"></div> <!-- Add the splash element -->
                <div class="card-body">
                    <h2 class="card-title"><a href="{% url 'post_detail' post.pk %}" class="text-decoration-none">{{ post.title }}</a></h2>
                    <p class="card-text">{{ post.body|truncatewords:50 }}</p>
                    <small class="text-muted">Posted by: {{ post.author }}</small>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-md-8 offset-md-2">
            <p class="text-center">No posts available.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
